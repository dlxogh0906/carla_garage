[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garage-ext"
version = "0.0.1"
description = "Team extension layer for carla_garage (VLM, risk, safety modules)."
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pylint>=2.17",
    "yapf>=0.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
