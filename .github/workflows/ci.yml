name: ci

on:
  push:
    branches: [main, "feat/**", "exp/**"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install extension package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (yapf diff-only)
        run: |
          yapf --diff --recursive src/ tests/ || (echo "Run: yapf -i -r src/ tests/" && exit 1)
      - name: Smoke tests
        env:
          PYTHONPATH: src
        run: pytest tests/smoke -q
